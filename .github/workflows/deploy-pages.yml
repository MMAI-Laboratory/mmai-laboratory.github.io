name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: npm run audit:dependencies

      - name: Resolve base path
        run: |
          # User/org sites (<owner>.github.io) are served from the domain root.
          # Compare case-insensitively: repo names are lowercased by GitHub while
          # the owner login may be mixed case (e.g. MMAI-Laboratory).
          repo_lc=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "$repo_lc" = "$owner_lc.github.io" ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - name: Sync Content
        run: npm run content:sync

      - name: Check official conference sources
        if: github.event_name != 'push'
        run: npm run deadlines:refresh

      - name: Validate Content
        run: npm run validate:content

      - name: Build Site
        run: npm run build:static

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

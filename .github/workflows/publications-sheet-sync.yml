name: Sync Publications from Google Sheets

# Reads the mmai_publications tab of the shared publication sheet and opens a review pull
# request when it differs from content/publications/sheet.snapshot.json.
# The /admin page dispatches this workflow after every save.

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      allow_large_deletion:
        description: Allow replacing the snapshot after deleting more than 25%
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mmai-publications-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Pull publication sheet
        run: npm run publications:pull
        env:
          PUBLICATIONS_SHEET_CSV_URL: ${{ vars.PUBLICATIONS_SHEET_CSV_URL }}
          PUBLICATIONS_SHEET_URL: ${{ vars.PUBLICATIONS_SHEET_URL }}
          ALLOW_LARGE_PUBLICATION_DELETION: ${{ inputs.allow_large_deletion || 'false' }}

      # Generated files carry a timestamp, so they would always differ; only a
      # changed snapshot is worth a pull request.
      - name: Detect sheet changes
        id: changes
        run: |
          if git diff --quiet -- content/publications/sheet.snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication changes in the sheet."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only publications and the News derived from them come from the
      # sheet, so only those are regenerated; photos, people images and the
      # site build stay with deploy-pages.yml, which runs after the merge.
      - name: Regenerate publications and news
        if: steps.changes.outputs.changed == 'true'
        run: npm run publications:sync

      - name: Validate content
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate:content

      - name: Create review pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "content: sync publications from Google Sheets"
          title: "content: sync publications from Google Sheets"
          body: |
            Google Sheets(mmai_publications 탭) Publication 데이터의 검증된 동기화 결과입니다.

            - Sheet 행 형식과 필수값 검증
            - Publication 및 자동 News 재생성
            - 전체 콘텐츠 검증 완료 (빌드는 병합 후 배포 워크플로가 수행)

            변경 내용을 확인한 뒤 병합하면 홈페이지에 배포됩니다.
          branch: automation/publications-sheet-sync
          delete-branch: true
          add-paths: |
            content/publications/sheet.snapshot.json
            src/generated/publications.generated.json
            src/generated/news.generated.json

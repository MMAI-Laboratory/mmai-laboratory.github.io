        <script>
            (function () {
                var params = new URLSearchParams(window.location.search);
                var redirectedPath = params.get("__gh_path__");

                if (!redirectedPath) {
                    return;
                }

                var basePath = window.location.pathname.replace(/\/$/, "");
                var normalizedPath = redirectedPath.startsWith("/")
                    ? redirectedPath
                    : "/" + redirectedPath;
                window.history.replaceState(
                    null,
                    "",
                    basePath + normalizedPath,
                );
            })();
        </script>
